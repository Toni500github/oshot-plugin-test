[repository]
name = "oshot-plugin-test"
url = "https://github.com/Toni500github/oshot-plugin-test"

[dependencies]
all = ["cmake", "a C compiler"]

[uppercase]
id = "io.github.toni500github.plugin-test"
description = "Test plugin for oshot: uppercases the extracted text"
authors = ["Toni500github"]
licenses = ["Unlicense"]
platforms = ["all"]
build-steps = [
    "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release",
    "cmake --build build --config Release",
]
output-dir = "build/out"
